<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StealthWatch Livestream Viewer</title>
  <script src="https://sdk.videosdk.live/rtc-js-prebuilt/0.3.32/rtc-js-prebuilt.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: black;
    }
  </style>
</head>
<body>
  <div id="meet" style="height: 100vh;"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get("roomId") || "defaultroom";

    const config = {
      name: "Viewer",
      meetingId: roomId,
      apiKey: "0eb2ddbb-7c4d-4b2f-b090-a7c3ae2b66c3",
      containerId: "meet",
      micEnabled: false,
      webcamEnabled: false,
      participantCanToggleSelfMic: false,
      participantCanToggleSelfWebcam: false,
      joinScreen: {
        visible: false
      },
      permissions: {
        askToJoin: false
      },
      livestream: {
        autoStart: true
      },
      theme: "DARK"
    };

    const meeting = new VideoSDKMeeting();
    meeting.init(config);
  </script>
</body>
</html>
